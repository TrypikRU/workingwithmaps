name: workingwithmaps
description: "Field Inspector / Field Route — offline-first Android application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.5'

dependencies:
  # go_router 18 pulls in cupertino_ui, whose reachable icons need this font.
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  # Keep runtime and generator aligned: newer patches change the preview API.
  drift: 2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  geolocator: ^14.0.3
  go_router: ^18.0.1
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.11.2
  drift_dev: 2.35.0

flutter:
  uses-material-design: true
