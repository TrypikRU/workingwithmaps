org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Сохраняем прежний Android DSL, пока плагины переходят на новый независимо от Kotlin.
android.newDsl=false
# Flutter 3.47 поддерживает встроенный Kotlin в AGP 9, в том числе для WorkManager.
android.builtInKotlin=true
# Кэш Pub и проект могут находиться на разных дисках Windows. Инкрементальный кэш Kotlin
# не может построить относительные пути; полная компиляция исключает ошибки закрытия кэша.
kotlin.incremental=false
