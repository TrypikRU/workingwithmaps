org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep the legacy Android DSL while plugins migrate independently of Kotlin.
android.newDsl=false
# Flutter 3.47 supports AGP 9 built-in Kotlin, including WorkManager.
android.builtInKotlin=true
# Pub cache and project may be on different Windows drives. Kotlin incremental
# caches cannot relativize those paths; full compilation avoids cache-close failures.
kotlin.incremental=false
